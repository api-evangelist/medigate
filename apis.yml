name: Medigate
description: >-
  Medigate was a healthcare IoT / connected-medical-device cybersecurity company
  (headquartered in Brooklyn, NY, backed by Partech and others) that built the
  first security platform dedicated to healthcare IoT — device discovery, risk
  assessment, and clinically-aware network segmentation for hospitals. Claroty
  completed its acquisition of Medigate on 2022-01-10 and folded the product into
  "Claroty xDome for Healthcare"; the standalone brand is retired and medigate.io
  now redirects to claroty.com. A residual customer-facing REST API remains live
  at api.medigate.io (with a password-gated interactive reference at
  api.medigate.io/docs) that integrations use to pull device inventory, device
  groups, and device risk scores.
